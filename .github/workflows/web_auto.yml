name: web_test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

  #  定时触发（UTC 时间，每天 0 点 = 北京早上 8 点）
  schedule:
    - cron: "0 0 * * *"

  # 允许在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  web_test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Upload allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./report