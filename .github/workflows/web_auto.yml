name: web_auto

on:
  push:
    branches:
      - master

jobs:
  web_test:
    runs-on: ubuntu-latest
    container: astral/uv:python3.12-bookworm-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Dependency
        run: pip install pytest
      - name: Test
        run: pytest